<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ForgeCore tool stack visual</title>
  <desc id="desc">A dark ForgeCore branded tool stack card layout.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="0.58" stop-color="#0f172a"/><stop offset="1" stop-color="#134e4a"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1280" cy="150" r="260" fill="#2dd4bf" opacity="0.18"/>
  <circle cx="230" cy="780" r="320" fill="#22d3ee" opacity="0.15"/>
  <text x="110" y="145" fill="#99f6e4" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="8">FORGECORE</text>
  <text x="110" y="235" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="900">Tool Stack</text>
  <text x="112" y="300" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="32">Use the lightest stack that gets the workflow shipped.</text>
  <g transform="translate(170 420)">
    <rect width="1260" height="260" rx="42" fill="#020617" opacity="0.72" stroke="#2dd4bf" stroke-opacity="0.42"/>
    <g transform="translate(70 70)"><rect width="230" height="120" rx="26" fill="#0f172a" stroke="#22d3ee"/><text x="36" y="73" fill="#e0f2fe" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Input</text></g>
    <g transform="translate(370 70)"><rect width="230" height="120" rx="26" fill="#0f172a" stroke="#a78bfa"/><text x="36" y="73" fill="#ede9fe" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">AI</text></g>
    <g transform="translate(670 70)"><rect width="230" height="120" rx="26" fill="#0f172a" stroke="#2dd4bf"/><text x="36" y="73" fill="#ccfbf1" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Review</text></g>
    <g transform="translate(970 70)"><rect width="230" height="120" rx="26" fill="#0f172a" stroke="#67e8f9"/><text x="36" y="73" fill="#ecfeff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Output</text></g>
    <path d="M300 130H370M600 130H670M900 130H970" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>
