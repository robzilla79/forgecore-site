  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="0.55" stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
