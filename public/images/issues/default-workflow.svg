<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ForgeCore workflow visual</title>
  <desc id="desc">A dark ForgeCore branded workflow diagram with three connected steps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <radialGradient id="glow" cx="25%" cy="22%" r="65%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g opacity="0.16" stroke="#94a3b8" stroke-width="1">
    <path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/>
  </g>
  <text x="110" y="145" fill="#67e8f9" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="8">FORGECORE</text>
  <text x="110" y="235" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="900">Operator Workflow</text>
  <text x="112" y="300" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="32">Turn AI tool noise into one repeatable business system.</text>
  <g transform="translate(115 450)">
    <rect width="360" height="190" rx="34" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="42" y="74" fill="#bae6fd" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">01</text>
    <text x="42" y="126" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Pick the job</text>
  </g>
  <g transform="translate(620 450)">
    <rect width="360" height="190" rx="34" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="42" y="74" fill="#ddd6fe" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">02</text>
    <text x="42" y="126" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Choose tools</text>
  </g>
  <g transform="translate(1125 450)">
    <rect width="360" height="190" rx="34" fill="#0f172a" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <text x="42" y="74" fill="#99f6e4" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">03</text>
    <text x="42" y="126" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Ship system</text>
  </g>
  <path d="M475 545H620M980 545H1125" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" stroke-dasharray="18 18" opacity="0.75"/>
</svg>
